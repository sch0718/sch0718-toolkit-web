version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 선언 파일은 소비 서비스 중 가장 낮은 TypeScript(가즈아 5.9)로 만든다. 메이저 올림은 사람이 정한다.
      # TS 7은 typescript-eslint도 아직 지원하지 않는다(2026-10-27).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-tools:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
