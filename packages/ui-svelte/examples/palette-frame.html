<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>팔레트 견본</title>
    <script>
      // 파일로 열어도 동작하도록 외부 모듈 없이, 첫 화면 전에 속성을 정한다.
      const query = new URLSearchParams(location.search);
      document.documentElement.dataset.palette = query.get('palette') || 'violet';
      document.documentElement.dataset.theme = query.get('theme') === 'dark' ? 'dark' : 'light';
    </script>
    <link rel="stylesheet" href="../src/lib/tokens.css" />
    <style>
      body {
        padding: 16px;
      }
      main {
        display: grid;
        gap: 12px;
      }
      h1 {
        font-size: var(--fs-title);
      }
      .surface,
      .surface2 {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--r-control);
      }
      .surface {
        background: var(--surface);
      }
      .surface2 {
        background: var(--surface2);
      }
      .secondary {
        color: var(--t2);
      }
      .muted {
        color: var(--t3);
      }
      button {
        min-height: var(--touch);
        padding: 8px 16px;
        border-radius: var(--r-control);
      }
      .primary {
        background: var(--accent);
        color: var(--on-accent);
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: var(--r-chip);
        background: var(--accent-soft);
        color: var(--accent);
      }
      .status {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .status span {
        padding: 4px 8px;
        border-radius: var(--r-chip);
      }
      .ok {
        color: var(--ok);
        background: var(--ok-soft);
      }
      .warn {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .err {
        color: var(--err);
        background: var(--err-soft);
      }
      .snackbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        background: var(--t1);
        color: var(--bg);
        border-radius: var(--r-control);
      }
      .snackbar button {
        color: var(--snack-action);
      }
      .control {
        min-height: var(--touch);
        padding: 8px;
        border: 1px solid var(--line-strong);
        border-radius: var(--r-control);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">색 팔레트 견본</h1>
      <p>기본 배경과 본문 글자</p>
      <section class="surface" aria-label="기본 면">
        <p>기본 면과 본문 글자</p>
        <p class="secondary">보조 글자</p>
        <p class="muted">약한 글자</p>
        <div class="status" aria-label="상태색">
          <span class="ok">정상</span>
          <span class="warn">주의</span>
          <span class="err">오류</span>
        </div>
      </section>
      <section class="surface2" aria-label="두 번째 면">
        <p>두 번째 면</p>
        <span class="badge">옅은 강조 배지</span>
      </section>
      <button type="button" class="primary">강조 버튼</button>
      <div class="control">누를 수 있는 테두리</div>
      <div class="snackbar">
        <span>저장했어요</span>
        <button type="button">되돌리기</button>
      </div>
    </main>
    <script>
      const names = {
        violet: '보라',
        blue: '파랑',
        teal: '청록',
        pastel: '파스텔',
        paper: '종이',
        night: '밤',
        forest: '숲',
        rose: '장미',
        plum: '자두',
        mono: '모노',
      };
      const palette = document.documentElement.dataset.palette;
      const mode = document.documentElement.dataset.theme === 'dark' ? '다크' : '라이트';
      const title = `${names[palette] || '보라'} · ${mode}`;
      document.getElementById('heading').textContent = title;
      document.title = title;
    </script>
  </body>
</html>
